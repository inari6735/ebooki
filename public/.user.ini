; eBook files (up to 200 MB) are uploaded in 8 MB chunks, so PHP never receives
; one huge request — these limits only need to clear a single chunk (+ the ≤5 MB
; cover), not the whole file. Honored by PHP-FPM / CGI (Symfony CLI, prod); for
; the built-in `php -S` server set the same values in the active php.ini.
upload_max_filesize = 12M
post_max_size = 12M
memory_limit = 128M
max_execution_time = 60
