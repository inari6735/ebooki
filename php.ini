; Project PHP overrides for the local dev server (Symfony CLI / built-in php -S,
; which ignores public/.user.ini).
;
; eBook files (up to 200 MB) are uploaded in 8 MB chunks, so no single request is
; large — these limits only need to clear one chunk (+ the ≤5 MB cover), NOT the
; whole file. Keep them small; a big post_max_size would apply to every endpoint.
upload_max_filesize = 12M
post_max_size = 12M
memory_limit = 128M
max_execution_time = 60
