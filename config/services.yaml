# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Default platform commission in basis points (1000 = 10%; author keeps 90%).
    # This is the fallback rate; richer rules are added as CommissionPolicy classes.
    app.ebook.commission_bps: 1000

    # Logical name recorded on every uploaded file (media.disk). Change together
    # with the flysystem adapter when moving to S3.
    app.ebook.storage_disk: 'local'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/User/Domain/User.php'
            - '../src/User/Infrastructure/Security/RefreshToken.php'

    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\MessengerQueryBus'

    App\Shared\Infrastructure\MessengerCommandBus:
        arguments:
            $commandBus: '@messenger.bus.command'

    App\Shared\Infrastructure\MessengerQueryBus:
        arguments:
            $queryBus: '@messenger.bus.query'

    # Event sourcing kernel (reusable across contexts).
    App\Shared\Domain\EventSourcing\EventStore: '@App\Shared\Infrastructure\EventSourcing\DoctrineEventStore'
    App\Shared\Domain\EventSourcing\EventBus: '@App\Shared\Infrastructure\EventSourcing\MessengerEventBus'
    App\Shared\Domain\EventSourcing\EventMetadataProvider: '@App\Shared\Infrastructure\EventSourcing\RequestEventMetadataProvider'

    App\Shared\Infrastructure\EventSourcing\MessengerEventBus:
        arguments:
            $eventBus: '@messenger.bus.event'

    App\User\Domain\UserRepository:
        alias: App\User\Infrastructure\DoctrineUserRepository
        public: true

    App\Ebook\Domain\Storage\FileStorage:
        alias: App\Ebook\Infrastructure\Storage\FlysystemFileStorage

    App\Ebook\Domain\MediaRepository:
        alias: App\Ebook\Infrastructure\DoctrineMediaRepository

    App\Ebook\Domain\EbookRepository:
        alias: App\Ebook\Infrastructure\DoctrineEbookRepository

    App\Commerce\Domain\Order\OrderRepository:
        alias: App\Commerce\Infrastructure\EventSourcedOrderRepository

    # Payments — Przelewy24 (secrets come from .env.local, see .env P24_* block).
    App\Commerce\Domain\Payment\PaymentGateway:
        alias: App\Commerce\Infrastructure\Payment\Przelewy24\Przelewy24Gateway

    App\Commerce\Infrastructure\Payment\Przelewy24\P24Signer:
        arguments:
            $crc: '%env(P24_CRC)%'

    App\Commerce\Infrastructure\Payment\Przelewy24\P24Config:
        arguments:
            $merchantId: '%env(int:P24_MERCHANT_ID)%'
            $posId: '%env(int:P24_POS_ID)%'
            $apiKey: '%env(P24_API_KEY)%'
            $sandbox: '%env(bool:P24_SANDBOX)%'

    App\Commerce\Presentation\CheckoutController:
        arguments:
            $commissionBps: '%app.ebook.commission_bps%'

    App\Ebook\Domain\CategoryRepository:
        alias: App\Ebook\Infrastructure\DoctrineCategoryRepository

    App\User\Infrastructure\Security\RefreshTokenRotator:
        public: true

    # Commission: policies are auto-tagged via CommissionPolicy's AutoconfigureTag;
    # the calculator receives them highest-priority first (flat rate is the fallback).
    App\Ebook\Domain\Commission\CommissionCalculator:
        arguments:
            $policies: !tagged_iterator app.ebook.commission_policy

    App\Ebook\Domain\Commission\FlatRateCommissionPolicy:
        arguments:
            $rate: !service
                class: App\Ebook\Domain\Commission\CommissionRate
                factory: ['App\Ebook\Domain\Commission\CommissionRate', 'fromBasisPoints']
                arguments: ['%app.ebook.commission_bps%']

when@test:
    services:
        # Public alias for CommissionWiringTest; it has no consumer yet (Phase 2
        # checkout will inject it), so without a reference the container would prune
        # this private service. The alias keeps it and exposes it to the test.
        test.ebook.commission_calculator:
            alias: App\Ebook\Domain\Commission\CommissionCalculator
            public: true

        # Payments: never call the real Przelewy24 API from tests. Swap the gateway
        # port for an in-memory fake the tests can configure/inspect.
        App\Tests\Commerce\Doubles\FakePaymentGateway:
            public: true
        App\Commerce\Domain\Payment\PaymentGateway:
            alias: App\Tests\Commerce\Doubles\FakePaymentGateway
            public: true
