framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []
            messenger.bus.command:
                middleware:
                    - validation
                    - doctrine_transaction
            messenger.bus.query:
                middleware:
                    - validation
            # Domain-event bus (event sourcing). Deliberately carries NO
            # doctrine_transaction middleware so synchronous projections join the
            # transaction opened by the command bus and commit atomically with the
            # appended events. Sync vs. async delivery is chosen per event by the
            # SyncTransport / AsyncTransport marker (routed below).
            messenger.bus.event: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            App\Shared\Application\Transport\AsyncTransport: async
            App\Shared\Application\Transport\SyncTransport: sync
